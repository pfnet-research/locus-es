[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "locus-es"
version = "0.1.0"
description = "E_S: one-shot correction of Kohn-Sham band edges and localized levels"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)"]

[project.scripts]
locus-es = "locus_es.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
