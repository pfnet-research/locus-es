[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "locus-es-qe"
version = "0.1.0"
description = "Exporter of the E_S input from Quantum ESPRESSO (pw.x) PAW calculations (prototype)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.15", "h5py>=3"]
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)"]

[tool.setuptools.packages.find]
where = ["src"]
