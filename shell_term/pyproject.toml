[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "locus-shell"
version = "0.1.0"
description = "The LOCUS shell term: pointwise kernel and LOCUS for PySCF"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]
optional-dependencies = {pyscf = ["pyscf>=2.3"]}
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)"]

[tool.setuptools.packages.find]
where = ["src"]
